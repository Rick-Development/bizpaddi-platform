name: Deploy Website

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute remote ssh commands to deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            export PATH="$HOME/bin:$HOME/.local/bin:/usr/local/apps/php83/bin:/usr/local/apps/php82/bin:/usr/local/bin:/usr/bin:$PATH"
            cd /home/bizpaddi/public_html

            # Locate PHP >= 8.2 binary (Webuzo or system)
            PHP_BIN=$(command -v php)
            for candidate in /usr/local/apps/php83/bin/php /usr/local/apps/php82/bin/php /usr/local/bin/php /usr/bin/php; do
              if [ -x "$candidate" ]; then
                PHP_BIN="$candidate"
                break
              fi
            done

            # Helper to run PHP and tolerate core dumps (exit status 134) on exit
            run_php() {
              "$PHP_BIN" -d opcache.enable_cli=0 -d memory_limit=-1 "$@"
              local status=$?
              if [ $status -eq 0 ] || [ $status -eq 134 ]; then
                return 0
              fi
              return $status
            }

            git fetch origin main
            git reset --hard origin/main

            # Ensure required directories exist and are writable
            mkdir -p storage/framework/{cache,data,sessions,testing,views} storage/logs bootstrap/cache
            chmod -R 775 storage bootstrap/cache || true

            # Create .env from .env.example if not yet present on the server
            if [ ! -f ".env" ] && [ -f ".env.example" ]; then
              cp .env.example .env
            fi

            # Locate or install Composer
            COMPOSER_BIN=$(command -v composer || true)
            if [ -z "$COMPOSER_BIN" ]; then
              for cpath in /usr/local/bin/composer /usr/bin/composer "$HOME/composer.phar" "$(pwd)/composer.phar"; do
                if [ -f "$cpath" ]; then
                  COMPOSER_BIN="$cpath"
                  break
                fi
              done
            fi
            if [ -z "$COMPOSER_BIN" ]; then
              curl -sS https://getcomposer.org/installer | "$PHP_BIN" -- --install-dir="$HOME" --filename=composer.phar
              COMPOSER_BIN="$HOME/composer.phar"
            fi

            # Remove stale bootstrap cache files before running artisan commands
            rm -f bootstrap/cache/*.php

            run_php "$COMPOSER_BIN" install --no-dev --optimize-autoloader --no-interaction --no-scripts
            run_php artisan package:discover --ansi || true

            # Generate APP_KEY if empty
            if ! grep -q "^APP_KEY=base64:" .env 2>/dev/null; then
              run_php artisan key:generate --force || true
            fi

            # Run migrations, storage links, and cache clearing
            run_php artisan migrate --force || true
            if [ -d "public/storage" ] && [ ! -L "public/storage" ]; then
              cp -rn public/storage/* storage/app/public/ 2>/dev/null || true
              rm -rf public/storage
              ln -s $(pwd)/storage/app/public public/storage
            fi
            run_php artisan storage:link || true
            run_php artisan optimize:clear || true
            run_php artisan optimize || true

            # Build frontend assets
            if command -v npm >/dev/null 2>&1; then
              npm install --prefer-offline --no-audit || true
              npm run build || true
            fi

            run_php artisan queue:restart || true
