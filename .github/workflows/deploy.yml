name: Deploy Website

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute remote ssh commands to deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd /home/billway/rickdevelopment
            git fetch origin main
            git reset --hard origin/main
            composer install --no-dev --optimize-autoloader --no-interaction --no-scripts
            php -d opcache.enable_cli=0 artisan package:discover --ansi
            rm -rf node_modules
            npm install
            npm run build
            php -d opcache.enable_cli=0 artisan migrate --force
            php -d opcache.enable_cli=0 artisan optimize:clear
            php -d opcache.enable_cli=0 artisan optimize
            php -d opcache.enable_cli=0 artisan queue:restart
