name: Deploy Website

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute remote ssh commands to deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd /home/billway/rickdevelopment
            
            # Helper to run PHP and tolerate core dumps (exit status 134) on exit
            run_php() {
              php -d opcache.enable_cli=0 "$@"
              local status=$?
              if [ $status -eq 0 ] || [ $status -eq 134 ]; then
                return 0
              fi
              return $status
            }
            
            git fetch origin main
            git reset --hard origin/main
            
            run_php $(which composer) install --no-dev --optimize-autoloader --no-interaction --no-scripts
            run_php artisan package:discover --ansi
            
            rm -rf node_modules
            npm install
            npm run build
            
            run_php artisan migrate --force
            run_php artisan optimize:clear
            run_php artisan route:clear
            run_php artisan view:clear
            run_php artisan config:clear
            run_php artisan optimize
            run_php artisan queue:restart
            run_php artisan reverb:restart

